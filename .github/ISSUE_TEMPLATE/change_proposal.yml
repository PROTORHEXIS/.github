name: "改进提案 / Change proposal"
description: "提出研究、产品、工程或治理变更 / Propose research, product, engineering or governance work"
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        此表单用于讨论候选方案，不代表已经批准实施或提升为组织规范。跨项目契约、架构、权限及公开范围变更须遵守目标仓库的适用审批规则。

        A proposal is not an approval or an adopted organization-wide standard.
  - type: textarea
    id: problem
    attributes:
      label: "问题与动机 / Problem and motivation"
      description: "当前存在什么问题或机会？ / What problem or opportunity motivates this?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "候选方案 / Proposed approach"
      description: "明确哪些是目标设想，而非已实现的能力。 / Separate proposed target from current implementation."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案与权衡 / Alternatives and tradeoffs"
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: "影响范围、证据与风险 / Scope, evidence and risks"
      description: "注明受影响仓库/契约、适用规范、隐私与兼容风险；勿披露私有材料。 / Identify scope, authority, risks and sanitized evidence."
    validations:
      required: false
  - type: dropdown
    id: stage
    attributes:
      label: "提案阶段 / Proposal stage"
      options:
        - "讨论中 / Proposed"
        - "需要研究 / Research required"
        - "等待授权或决策 / Decision required"
    validations:
      required: true
